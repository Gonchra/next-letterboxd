services:
  postgres:
    image: docker.io/library/postgres:18.3
    restart: unless-stopped
    container_name: next-js-proj-postgres
    environment:
      - POSTGRES_DB=nextjs-course-proj
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextjs-course"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: